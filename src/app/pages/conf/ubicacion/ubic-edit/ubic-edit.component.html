<div class="modal fade" id="editUbicacion" tabindex="-1" aria-labelledby="projectModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="projectModalLabel">{{title}}: {{ubicacionSeleccionado?.numero_identificador}}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
                    (click)="onClose()"></button>
            </div>
            <div class="modal-body">
                <app-loading *ngIf="isLoading"></app-loading>
                <div class="container" *ngIf="!isLoading">
                    <form *ngIf="ubicacionForm" class="form-horizontal form-material" [formGroup]="ubicacionForm">
                        <div class="row">
                            <div class="col-xs-12 col-md-4">
                                <label>numero_identificador <span class="required">*</span></label>
                                <input type="text" formControlName="numero_identificador" class="form-control" required>
                                <div *ngIf="ubicacionForm.get('numero_identificador')?.touched" class="text-danger">
                                    <div *ngIf="ubicacionForm.get('numero_identificador')?.errors?.['required']">
                                        Campo Requerido
                                    </div>
                                    <div *ngIf="ubicacionForm.get('numero_identificador')?.errors?.['minlength']">
                                        Mínimo 3 Caracteres
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-12 col-md-4">
                                <label>bloque_torre <span class="required">*</span></label>
                                <input type="text" formControlName="bloque_torre" class="form-control">
                                <div *ngIf="ubicacionForm.get('bloque_torre')?.touched && ubicacionForm.get('bloque_torre')?.errors?.['required']"
                                    class="text-danger">Campo Requerido</div>
                            </div>
                            <div class="col-xs-12 col-md-4 ">
                                <label>Empresa o Residencia<span class="required">*</span></label>
                                <div class="input-group">
                                    <select class="form-control" formControlName="empresaId">
                                        <option value="">Seleccione</option>
                                        <option *ngFor="let data of empresas" [value]="data._id">
                                            {{data.nombre}}
                                        </option>
                                    </select>
                                    <div *ngIf="ubicacionForm.get('pais')?.touched && ubicacionForm.get('pais')?.errors?.['required']"
                                        class="text-danger">Campo Requerido</div>
                                </div>
                            </div>

                        </div>
                        <div class="row mt-3">
                            <div class="col-4">
                                <button (click)="handleSubmit()" class="btn btn-outline-success">
                                    {{ ubicacionSeleccionado ? 'Actualizar y Continuar' : 'Crear y Continuar' }}
                                </button>
                            </div>

                        </div>

                    </form>


                </div>
            </div>
            <!-- <div class="modal-footer ">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                    (click)="onClose()">Cerrar</button>
            </div> -->
        </div>
    </div>
</div>
