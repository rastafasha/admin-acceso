<div class="modal fade" id="editEmpresa" tabindex="-1" aria-labelledby="projectModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="projectModalLabel">{{title}}: {{empresaSeleccionado?.name}}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
                    (click)="onClose()"></button>
            </div>
            <div class="modal-body">
                <app-loading *ngIf="isLoading"></app-loading>
                <div class="container" *ngIf="!isLoading">
                    <form *ngIf="empresaForm" class="form-horizontal form-material" [formGroup]="empresaForm">
                        <div class="row">
                            <div class="col-xs-12 col-md-4">
                                <label>Nombre <span class="required">*</span></label>
                                <input type="text" formControlName="nombre" class="form-control" required>
                                <div *ngIf="empresaForm.get('nombre')?.touched" class="text-danger">
                                    <div *ngIf="empresaForm.get('nombre')?.errors?.['required']">
                                        Campo Requerido
                                    </div>
                                    <div *ngIf="empresaForm.get('nombre')?.errors?.['minlength']">
                                        Mínimo 3 Caracteres
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-12 col-md-4">
                                <label>rif_nit </label>
                                <input type="text" formControlName="rif_nit" class="form-control">
                            </div>
                            <div class="col-xs-12 col-md-4">
                                <label>telefono <span class="required">*</span></label>
                                <input type="text" formControlName="telefono" class="form-control">
                                <div *ngIf="empresaForm.get('telefono')?.touched && empresaForm.get('telefono')?.errors?.['required']"
                                    class="text-danger">Campo Requerido</div>
                            </div>
                            <div class="col-xs-12 col-md-4 ">
                                <label>Pais<span class="required">*</span></label>
                                <div class="input-group">
                                    <select class="form-control" formControlName="pais">
                                        <option value="">Seleccione</option>
                                        <option *ngFor="let data of paises" [value]="data._id">
                                            {{data.pais}}
                                        </option>
                                    </select>
                                    <div *ngIf="empresaForm.get('pais')?.touched && empresaForm.get('pais')?.errors?.['required']"
                                        class="text-danger">Campo Requerido</div>
                                </div>
                            </div>
                            <div class="col-xs-12 col-md-4">
                                <label>tipo</label>
                                <select class="form-control selecttyp" formControlName="tipo">
                                    <option value="">Seleccione</option>
                                    <option value="EMPRESA">Empresa</option>
                                    <option value="RESIDENCIAL">Residencial</option>
                                </select>
                                <div *ngIf="empresaForm.get('tipo')?.touched && empresaForm.get('tipo')?.errors?.['required']"
                                    class="text-danger">Campo Requerido</div>

                            </div>
                            <div class="col-xs-12 col-md-4">
                                <label>status</label>
                                <select class="form-control selecttyp" formControlName="status">
                                    <option value="">Seleccione</option>
                                    <option value="ACTIVO">Activo</option>
                                    <option value="SUSPENDIDO">Suspendido</option>
                                </select>
                                <div *ngIf="empresaForm.get('status')?.touched && empresaForm.get('status')?.errors?.['required']"
                                    class="text-danger">Campo Requerido</div>

                            </div>

                            <div class="clear"></div>
                            <br>
                            <div class="clear"></div>
                            <div class="row mb-3">
                                <div class="col-xs-12 ">
                                    <label>dirección </label>
                                    <textarea formControlName="direccion" id="description"
                                        class="form-control"></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-4">
                                <button (click)="handleSubmit()" class="btn btn-outline-success">
                                    {{ projectSeleccionado ? 'Actualizar y Continuar' : 'Crear y Continuar' }}
                                </button>
                            </div>
                            
                        </div>

                    </form>


                </div>
            </div>
            <div class="modal-footer ">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                    (click)="onClose()">Cerrar</button>
            </div>
        </div>
    </div>
</div>
